steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/effective-engine:$COMMIT_SHA', '.']

  # Step 2: Push the image to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effective-engine:$COMMIT_SHA']

options:
  logging: CLOUD_LOGGING_ONLY
